name: Sync public docs

# Runs whenever a change lands in acme-corp-internal/ on the main branch -
# e.g. when GitBook's Git Sync exports an edit made in the editor.
# It runs the sync script and, if anything in acme-corp-public/ changed
# as a result, commits and pushes that change back to the repo. That
# push is what GitBook's Git Sync for the "Acme Corp - Public" space
# then picks up automatically.

on:
  push:
    branches:
      - main
    paths:
      - "acme-corp-internal/**"
      - "public-pages.json"
  workflow_dispatch: {} # lets you also trigger it manually from GitHub's UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        run: node sync-public-docs.mjs

      - name: Commit and push changes, if any
        run: |
          git config user.name "docs-sync-bot"
          git config user.email "docs-sync-bot@users.noreply.github.com"
          git add acme-corp-public/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync public docs from acme-corp-internal"
            git push
          fi
