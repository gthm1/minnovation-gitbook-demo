name: Sync public docs

# Runs whenever anything changes on main - e.g. when GitBook's Git Sync
# exports an edit made in any customer's internal space. The script
# auto-discovers every "*-internal" folder with a matching "*-public"
# folder, so this workflow doesn't need per-customer path filters and
# never needs editing when a new customer is added - only the script's
# own folder-naming convention matters.
#
# For each customer, it syncs pages tagged "public" into that
# customer's public folder and pushes the result. That push is what
# each customer's "-public" GitBook space then picks up automatically
# via its own Git Sync.

on:
  push:
    branches:
      - main
  workflow_dispatch: {} # lets you also trigger it manually from GitHub's UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script (all customers)
        run: node sync-public-docs.mjs

      - name: Commit and push changes, if any
        run: |
          git config user.name "docs-sync-bot"
          git config user.email "docs-sync-bot@users.noreply.github.com"
          git add -- '*-public'
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync public docs (all customers)"
            git push
          fi

